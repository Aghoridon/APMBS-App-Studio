          package com.apmbs.appstudio

          import android.content.ContentValues
          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.Base64
          import com.android.apksig.ApkSigner
          import org.json.JSONObject
          import java.io.*
          import java.util.zip.*

          object OfflineApkBuilder {
              class CountingOutputStream(out: OutputStream) : FilterOutputStream(out) {
                  var count: Long = 0
                  override fun write(b: Int) { out.write(b); count++ }
                  override fun write(b: ByteArray, off: Int, len: Int) { out.write(b, off, len); count += len }
              }

              fun buildSignedApk(context: Context, configJsonStr: String, finalHtmlStr: String, onProgress: (Int, String) -> Unit): JSONObject {
                  val cfg = JSONObject(configJsonStr)
                  val appName = cfg.optString("appName", "APMBS App").trim().ifEmpty { "APMBS App" }
                  val packageName = cfg.optString("packageName", "com.apmbs.customapp").trim().ifEmpty { "com.apmbs.customapp" }
                  val versionName = cfg.optString("version", "1.0.0").trim().ifEmpty { "1.0.0" }
                  val parts = versionName.split(".").map { it.toIntOrNull() ?: 0 }
                  val versionCode = (parts.getOrElse(0) { 1 }) * 10000 + (parts.getOrElse(1) { 0 }) * 100 + (parts.getOrElse(2) { 0 })
                  val iconDataUrl = cfg.optString("iconDataUrl", "")
                  val mode = cfg.optString("mode", "HTML")
                  val zipDataUrl = cfg.optString("zipDataUrl", "")

                  onProgress(20, "Loading RSA-2048 Keystore & SHA-256 Certificate...")
                  val keyMaterial = KeystoreManager.getOrCreateKeystore(context, packageName, appName)

                  onProgress(45, "Patching Binary AndroidManifest.xml & Packaging Assets...")
                  val workDir = File(context.cacheDir, "apk_build_${System.currentTimeMillis()}").apply { mkdirs() }
                  val unsignedApk = File(workDir, "unsigned.apk")
                  val customIconBytes: ByteArray? = if (iconDataUrl.contains(",")) {
                      try { Base64.decode(iconDataUrl.substringAfter(","), Base64.DEFAULT) } catch (_: Exception) { null }
                  } else null

                  val cos = CountingOutputStream(BufferedOutputStream(FileOutputStream(unsignedApk)))
                  val zos = ZipOutputStream(cos)

                  context.assets.open("base_template.apk").use { rawIn ->
                      val zis = ZipInputStream(BufferedInputStream(rawIn))
                      var entry: ZipEntry? = zis.nextEntry
                      while (entry != null) {
                          val name = entry.name
                          if (!entry.isDirectory && !name.startsWith("META-INF/")) {
                              val rawBytes = zis.readBytes()
                              val outBytes = when {
                                  name == "AndroidManifest.xml" -> AxmlPatcher.patchManifest(
                                      rawBytes,
                                      mapOf("com.apmbs.templateapp" to packageName, "APMBS_APP_LABEL_PLACEHOLDER" to appName, "1.0.0" to versionName),
                                      versionCode
                                  )
                                  name == "assets/index.html" -> finalHtmlStr.toByteArray(Charsets.UTF_8)
                                  name == "assets/app_config.json" -> configJsonStr.toByteArray(Charsets.UTF_8)
                                  customIconBytes != null && name.contains("ic_launcher") && name.endsWith(".png") -> customIconBytes
                                  else -> rawBytes
                              }
                              if (name == "resources.arsc") {
                                  val headerBase = cos.count + 30 + name.toByteArray(Charsets.UTF_8).size
                                  val pad = ((4 - (headerBase % 4)) % 4).toInt()
                                  val ze = ZipEntry(name).apply {
                                      method = ZipEntry.STORED
                                      size = outBytes.size.toLong(); compressedSize = outBytes.size.toLong()
                                      crc = CRC32().apply { update(outBytes) }.value
                                      if (pad > 0) extra = ByteArray(pad)
                                  }
                                  zos.putNextEntry(ze); zos.write(outBytes); zos.closeEntry()
                              } else {
                                  zos.putNextEntry(ZipEntry(name)); zos.write(outBytes); zos.closeEntry()
                              }
                          }
                          zis.closeEntry()
                          entry = zis.nextEntry
                      }
                  }

                  if (mode == "Offline ZIP" && zipDataUrl.contains(",")) {
                      val zipBytes = Base64.decode(zipDataUrl.substringAfter(","), Base64.DEFAULT)
                      val zipEntries = mutableMapOf<String, ByteArray>()
                      ZipInputStream(ByteArrayInputStream(zipBytes)).use { uz ->
                          var ze = uz.nextEntry
                          while (ze != null) {
                              if (!ze.isDirectory && !ze.name.startsWith("__MACOSX")) zipEntries[ze.name] = uz.readBytes()
                              uz.closeEntry(); ze = uz.nextEntry
                          }
                      }
                      val idxKey = zipEntries.keys.firstOrNull { it.endsWith("index.html") }
                      val stripPrefix = if (idxKey != null && idxKey.contains("/")) idxKey.substringBeforeLast("/") + "/" else ""
                      for ((k, data) in zipEntries) {
                          val rel = if (stripPrefix.isNotEmpty() && k.startsWith(stripPrefix)) k.removePrefix(stripPrefix) else k
                          if (rel.isNotEmpty()) {
                              zos.putNextEntry(ZipEntry("assets/www/$rel"))
                              zos.write(data)
                              zos.closeEntry()
                          }
                      }
                  }
                  zos.close()

                  onProgress(75, "Signing APK with v1 + v2 Digital Signature...")
                  val buildsDir = File(context.getExternalFilesDir(null), "builds").apply { mkdirs() }
                  val cleanName = appName.replace(Regex("[^a-zA-Z0-9]"), "_")
                  val apkFileName = "${cleanName}_v${versionName}_${System.currentTimeMillis()}.apk"
                  val signedApk = File(buildsDir, apkFileName)

                  val signerConfig = ApkSigner.SignerConfig.Builder("CERT", keyMaterial.privateKey, listOf(keyMaterial.certificate)).build()
                  ApkSigner.Builder(listOf(signerConfig))
                      .setInputApk(unsignedApk).setOutputApk(signedApk)
                      .setV1SigningEnabled(true).setV2SigningEnabled(true).setV3SigningEnabled(false)
                      .build().sign()

                  onProgress(92, "Saving APK & Certificate to Downloads...")
                  copyToPublicDownloads(context, signedApk, apkFileName, "application/vnd.android.package-archive")
                  val certTemp = File(workDir, "${cleanName.lowercase()}_upload_cert.pem").apply { writeText(keyMaterial.certPem) }
                  copyToPublicDownloads(context, certTemp, certTemp.name, "application/x-pem-file")
                  workDir.deleteRecursively()
                  onProgress(100, "Build Complete!")

                  return JSONObject().apply {
                      put("success", true); put("apkFileName", apkFileName); put("sizeKb", signedApk.length() / 1024)
                      put("sha1", keyMaterial.sha1); put("sha256", keyMaterial.sha256)
                  }
              }

              fun copyToPublicDownloads(context: Context, srcFile: File, displayName: String, mime: String) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, displayName)
                              put(MediaStore.Downloads.MIME_TYPE, mime)
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/APMBS_App_Studio")
                          }
                          context.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)?.let { uri ->
                              context.contentResolver.openOutputStream(uri)?.use { os -> FileInputStream(srcFile).use { it.copyTo(os) } }
                          }
                      } else {
                          val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "APMBS_App_Studio").apply { mkdirs() }
                          srcFile.copyTo(File(dir, displayName), overwrite = true)
                      }
                  } catch (_: Exception) {}
              }
          }

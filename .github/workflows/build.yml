          package com.apmbs.appstudio

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.*
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.FileProvider
          import kotlinx.coroutines.*
          import org.json.JSONObject
          import java.io.File

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var fileCallback: ValueCallback<Array<Uri>>? = null
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                  }

                  webView.addJavascriptInterface(StudioNativeBridge(), "StudioNative")
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(wv: WebView?, cb: ValueCallback<Array<Uri>>?, params: FileChooserParams?): Boolean {
                          fileCallback = cb
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          startActivityForResult(Intent.createChooser(intent, "Choose File"), 2001)
                          return true
                      }
                  }

                  webView.loadUrl("file:///android_asset/studio.html")
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 2001) {
                      val res = if (resultCode == RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      fileCallback?.onReceiveValue(res)
                      fileCallback = null
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
              }

              inner class StudioNativeBridge {
                  @JavascriptInterface
                  fun buildOfflineApk(configJson: String, finalHtml: String) {
                      scope.launch(Dispatchers.IO) {
                          try {
                              val res = OfflineApkBuilder.buildSignedApk(
                                  this@MainActivity,
                                  configJson,
                                  finalHtml
                              ) { pct, msg ->
                                  runOnUiThread {
                                      val safeMsg = JSONObject.quote(msg)
                                      webView.evaluateJavascript("window.onNativeBuildProgress && window.onNativeBuildProgress($pct, $safeMsg);", null)
                                  }
                              }
                              runOnUiThread {
                                  webView.evaluateJavascript("window.onNativeBuildComplete && window.onNativeBuildComplete(${res});", null)
                              }
                          } catch (e: Exception) {
                              val err = JSONObject.quote(e.message ?: "Build failed")
                              runOnUiThread {
                                  webView.evaluateJavascript("window.onNativeBuildError && window.onNativeBuildError($err);", null)
                              }
                          }
                      }
                  }

                  @JavascriptInterface
                  fun installApk(apkFileName: String) {
                      runOnUiThread {
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                                  Toast.makeText(this@MainActivity, "Please allow 'Install unknown apps' for APMBS App Studio", Toast.LENGTH_LONG).show()
                                  startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                                  return@runOnUiThread
                              }
                              val file = File(File(getExternalFilesDir(null), "builds"), apkFileName)
                              if (!file.exists()) {
                                  Toast.makeText(this@MainActivity, "APK file not found", Toast.LENGTH_SHORT).show()
                                  return@runOnUiThread
                              }
                              val uri = FileProvider.getUriForFile(this@MainActivity, "$packageName.fileprovider", file)
                              val intent = Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(uri, "application/vnd.android.package-archive")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(intent)
                          } catch (e: Exception) {
                              Toast.makeText(this@MainActivity, "Install error: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun shareApkFile(apkFileName: String, targetApp: String) {
                      runOnUiThread {
                          try {
                              val file = File(File(getExternalFilesDir(null), "builds"), apkFileName)
                              if (!file.exists()) return@runOnUiThread
                              val uri = FileProvider.getUriForFile(this@MainActivity, "$packageName.fileprovider", file)
                              val intent = Intent(Intent.ACTION_SEND).apply {
                                  type = "application/vnd.android.package-archive"
                                  putExtra(Intent.EXTRA_STREAM, uri)
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  if (targetApp == "wa") setPackage("com.whatsapp")
                                  if (targetApp == "tg") setPackage("org.telegram.messenger")
                              }
                              startActivity(Intent.createChooser(intent, "Share APK"))
                          } catch (e: Exception) {
                              val fallback = Intent(Intent.ACTION_SEND).apply {
                                  val file = File(File(getExternalFilesDir(null), "builds"), apkFileName)
                                  val uri = FileProvider.getUriForFile(this@MainActivity, "$packageName.fileprovider", file)
                                  type = "application/vnd.android.package-archive"
                                  putExtra(Intent.EXTRA_STREAM, uri)
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              }
                              startActivity(Intent.createChooser(fallback, "Share APK"))
                          }
                      }
                  }

                  @JavascriptInterface
                  fun exportKeystoreP12(packageNameStr: String, appNameStr: String) {
                      runOnUiThread {
                          try {
                              val km = KeystoreManager.getOrCreateKeystore(this@MainActivity, packageNameStr, appNameStr)
                              val outName = "${appNameStr.replace(Regex("[^a-zA-Z0-9]"), "_")}_signing_key.p12"
                              OfflineApkBuilder.copyToPublicDownloads(this@MainActivity, km.p12File, outName, "application/x-pkcs12")
                              Toast.makeText(this@MainActivity, "Saved to Downloads/APMBS_App_Studio/$outName", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              Toast.makeText(this@MainActivity, "Export error: ${e.message}", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }
          }

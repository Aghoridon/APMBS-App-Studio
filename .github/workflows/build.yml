name: Build APMBS App Studio (100% Offline Kotlin)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-offline-studio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Default 512x512 PNG Icons
        run: |
          python3 - << 'PYEOF'
          import zlib, struct, os
          def make_png(path, r, g, b):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              w, h = 512, 512
              raw = b"".join(b"\x00" + bytes([r, g, b, 255]) * w for _ in range(h))
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw, 6)) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)
          make_png("template/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png", 99, 102, 241)
          make_png("studio/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png", 79, 70, 229)
          PYEOF

      - name: Create Runtime Base Template Project
        run: |
          mkdir -p template/app/src/main/java/com/apmbs/templateapp
          mkdir -p template/app/src/main/assets

          cat << 'EOF' > template/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TemplateApp"
          include ':app'
          EOF

          cat << 'EOF' > template/build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > template/gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > template/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.apmbs.templateapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.apmbs.templateapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 10000
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          EOF

          cat << 'EOF' > template/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              >
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="APMBS_APP_LABEL_PLACEHOLDER"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > template/app/src/main/assets/index.html
          <!DOCTYPE html><html><body style="background:#0D0E12;color:#fff;font-family:sans-serif;text-align:center;padding-top:40vh;"><h2>APMBS App</h2></body></html>
          EOF

          cat << 'EOF' > template/app/src/main/assets/app_config.json
          {"appName":"APMBS App","mode":"HTML","enableSplash":true,"splashBgColor":"#0D0E12","splashTextColor":"#FFFFFF","orientation":"Portrait","fixedTextSize":true,"enableZoom":true,"copyProtection":false,"appPinLock":"","whatsNewMsg":""}
          EOF

          cat << 'KOTLINEOF' > template/app/src/main/java/com/apmbs/templateapp/MainActivity.kt
          package com.apmbs.templateapp

          import android.annotation.SuppressLint
          import android.app.AlertDialog
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.graphics.Color
          import android.net.Uri
          import android.os.*
          import android.provider.MediaStore
          import android.text.InputType
          import android.util.Base64
          import android.view.Gravity
          import android.view.View
          import android.webkit.*
          import android.widget.*
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var fileUploadCallback: ValueCallback<Array<Uri>>? = null

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val configStr = try {
                      assets.open("app_config.json").bufferedReader().use { it.readText() }
                  } catch (e: Exception) { "{}" }
                  val cfg = JSONObject(configStr)

                  when (cfg.optString("orientation", "Portrait")) {
                      "Portrait" -> requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                      "Landscape" -> requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
                      else -> requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                  }

                  if (cfg.optBoolean("fullscreenMode", false)) {
                      WindowCompat.setDecorFitsSystemWindows(window, false)
                      WindowInsetsControllerCompat(window, window.decorView).apply {
                          hide(WindowInsetsCompat.Type.systemBars())
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  }

                  val root = FrameLayout(this)
                  webView = WebView(this)
                  root.addView(webView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  val enableSplash = cfg.optBoolean("enableSplash", true)
                  val splashLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(try { Color.parseColor(cfg.optString("splashBgColor", "#0D0E12")) } catch (e: Exception) { Color.BLACK })
                      val iconView = ImageView(this@MainActivity).apply {
                          setImageResource(R.mipmap.ic_launcher)
                          layoutParams = LinearLayout.LayoutParams(220, 220)
                      }
                      val titleView = TextView(this@MainActivity).apply {
                          text = cfg.optString("appName", "APMBS App")
                          textSize = 20f
                          setTextColor(try { Color.parseColor(cfg.optString("splashTextColor", "#FFFFFF")) } catch (e: Exception) { Color.WHITE })
                          setPadding(0, 32, 0, 16)
                      }
                      val prog = ProgressBar(this@MainActivity)
                      addView(iconView)
                      addView(titleView)
                      addView(prog)
                  }

                  if (enableSplash) {
                      root.addView(splashLayout, FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      ))
                      Handler(Looper.getMainLooper()).postDelayed({
                          splashLayout.visibility = View.GONE
                      }, 1300)
                  }

                  setContentView(root)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      setSupportZoom(cfg.optBoolean("enableZoom", true))
                      builtInZoomControls = cfg.optBoolean("enableZoom", true)
                      displayZoomControls = false
                      if (cfg.optBoolean("fixedTextSize", true)) {
                          textZoom = 100
                      }
                  }

                  if (cfg.optBoolean("copyProtection", false)) {
                      webView.setOnLongClickListener { true }
                      webView.isHapticFeedbackEnabled = false
                  }

                  webView.addJavascriptInterface(NativeAppBridge(), "AndroidBridge")
                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          val wn = cfg.optString("whatsNewMsg", "")
                          val ver = cfg.optString("version", "1.0.0")
                          if (wn.isNotEmpty()) {
                              val prefs = getSharedPreferences("apmbs_prefs", Context.MODE_PRIVATE)
                              if (!prefs.getBoolean("wn_$ver", false)) {
                                  prefs.edit().putBoolean("wn_$ver", true).apply()
                                  AlertDialog.Builder(this@MainActivity)
                                      .setTitle("What's New in v$ver")
                                      .setMessage(wn)
                                      .setPositiveButton("OK", null)
                                      .show()
                              }
                          }
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onGeolocationPermissionsShowPrompt(origin: String?, callback: GeolocationPermissions.Callback?) {
                          callback?.invoke(origin, true, false)
                      }
                      override fun onShowFileChooser(wv: WebView?, filePathCallback: ValueCallback<Array<Uri>>?, params: FileChooserParams?): Boolean {
                          fileUploadCallback = filePathCallback
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                          }
                          startActivityForResult(Intent.createChooser(intent, "Select File"), 1001)
                          return true
                      }
                  }

                  webView.setDownloadListener { url, _, _, mimeType, _ ->
                      if (url.startsWith("data:")) {
                          val base64Part = url.substringAfter(",")
                          val ext = MimeTypeMap.getSingleton().getExtensionFromMimeType(mimeType) ?: "pdf"
                          saveBase64ToDownloads("APMBS_Report_${System.currentTimeMillis()}.$ext", base64Part)
                      }
                  }

                  val pin = cfg.optString("appPinLock", "")
                  if (pin.isNotEmpty()) {
                      val input = EditText(this).apply {
                          inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                          hint = "Enter 4-digit PIN"
                      }
                      AlertDialog.Builder(this)
                          .setTitle("🔒 App Locked")
                          .setView(input)
                          .setCancelable(false)
                          .setPositiveButton("Unlock") { _, _ ->
                              if (input.text.toString() == pin) loadAppContent(cfg)
                              else finish()
                          }
                          .show()
                  } else {
                      loadAppContent(cfg)
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack()
                          else finish()
                      }
                  })
              }

              private fun loadAppContent(cfg: JSONObject) {
                  val mode = cfg.optString("mode", "HTML")
                  val url = cfg.optString("websiteUrl", "")
                  if (mode == "Website" && url.startsWith("http")) {
                      webView.loadUrl(url)
                  } else {
                      webView.loadUrl("file:///android_asset/index.html")
                  }
              }

              private fun saveBase64ToDownloads(fileName: String, base64Data: String) {
                  try {
                      val bytes = Base64.decode(base64Data.substringAfter(","), Base64.DEFAULT)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, fileName)
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                          }
                          val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          uri?.let { contentResolver.openOutputStream(it)?.use { os -> os.write(bytes) } }
                      } else {
                          val dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                          FileOutputStream(File(dir, fileName)).use { it.write(bytes) }
                      }
                      runOnUiThread { Toast.makeText(this, "Saved to Downloads: $fileName", Toast.LENGTH_LONG).show() }
                  } catch (e: Exception) {
                      runOnUiThread { Toast.makeText(this, "Save error: ${e.message}", Toast.LENGTH_SHORT).show() }
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001) {
                      val res = if (resultCode == RESULT_OK && data?.data != null) arrayOf(data.data!!) else null
                      fileUploadCallback?.onReceiveValue(res)
                      fileUploadCallback = null
                  }
              }

              inner class NativeAppBridge {
                  @JavascriptInterface
                  fun saveFile(fileName: String, base64Data: String) {
                      saveBase64ToDownloads(fileName, base64Data)
                  }

                  @JavascriptInterface
                  fun vibrate(ms: Long) {
                      val v = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v?.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          v?.vibrate(ms)
                      }
                  }

                  @JavascriptInterface
                  fun shareText(text: String) {
                      val intent = Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"
                          putExtra(Intent.EXTRA_TEXT, text)
                      }
                      startActivity(Intent.createChooser(intent, "Share via"))
                  }

                  @JavascriptInterface
                  fun authBio() {
                      runOnUiThread {
                          val executor = ContextCompat.getMainExecutor(this@MainActivity)
                          val prompt = BiometricPrompt(this@MainActivity, executor, object : BiometricPrompt.AuthenticationCallback() {
                              override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                                  webView.evaluateJavascript("if(window.onBiometricSuccess) window.onBiometricSuccess();", null)
                              }
                          }) 
                          val info = BiometricPrompt.PromptInfo.Builder()
                              .setTitle("Biometric Authentication")
                              .setNegativeButtonText("Cancel")
                              .build()
                          prompt.authenticate(info)
                      }
                  }
              }
          }
          KOTLINEOF

      - name: Compile Base Template APK
        working-directory: template
        run: gradle assembleRelease

      - name: Create APMBS App Studio Native Kotlin Project
        run: |
          mkdir -p studio/app/src/main/java/com/apmbs/appstudio
          mkdir -p studio/app/src/main/assets
          mkdir -p studio/app/src/main/res/xml

          cp template/app/build/outputs/apk/release/app-release-unsigned.apk studio/app/src/main/assets/base_template.apk

          cat << 'EOF' > studio/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "APMBSAppStudio"
          include ':app'
          EOF

          cat << 'EOF' > studio/build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > studio/gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > studio/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.apmbs.appstudio'
              compileSdk 34
              defaultConfig {
                  applicationId "com.apmbs.appstudio"
                  minSdk 24
                  targetSdk 34
                  versionCode 10000
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
                            packaging {
                  resources {
                      excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
                      pickFirsts += ['META-INF/**']
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
              implementation 'com.android.tools.build:apksig:8.5.2'
              implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
          }
          EOF

          cat << 'EOF' > studio/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="builds" path="." />
              <files-path name="internal_files" path="." />
              <cache-path name="cache_files" path="." />
          </paths>
          EOF

          cat << 'EOF' > studio/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              >
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="APMBS App Studio"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat << 'KOTLINEOF' > studio/app/src/main/java/com/apmbs/appstudio/AxmlPatcher.kt
          package com.apmbs.appstudio

          import java.io.ByteArrayOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          object AxmlPatcher {
              fun patchManifest(axmlBytes: ByteArray, replacements: Map<String, String>, newVersionCode: Int): ByteArray {
                  val buf = ByteBuffer.wrap(axmlBytes).order(ByteOrder.LITTLE_ENDIAN)
                  val magic = buf.getInt(0)
                  if (magic != 0x00080003) return axmlBytes

                  val spOffset = 8
                  val spType = buf.getInt(spOffset)
                  if (spType != 0x001C0001) return axmlBytes

                  val spChunkSize = buf.getInt(spOffset + 4)
                  val stringCount = buf.getInt(spOffset + 8)
                  val styleCount = buf.getInt(spOffset + 12)
                  val flags = buf.getInt(spOffset + 16)
                  val stringsStart = buf.getInt(spOffset + 20)
                  val stylesStart = buf.getInt(spOffset + 24)
                  val isUtf8 = (flags and 0x00000100) != 0

                  val offsetsStart = spOffset + 28
                  val strOffsets = IntArray(stringCount) { i -> buf.getInt(offsetsStart + i * 4) }
                  val styleOffsetsBytes = ByteArray(styleCount * 4)
                  if (styleCount > 0) {
                      System.arraycopy(axmlBytes, offsetsStart + stringCount * 4, styleOffsetsBytes, 0, styleOffsetsBytes.size)
                  }

                  val dataBase = spOffset + stringsStart
                  val strings = MutableList(stringCount) { i ->
                      val pos = dataBase + strOffsets[i]
                      if (isUtf8) readUtf8String(axmlBytes, pos) else readUtf16String(axmlBytes, pos)
                  }

                  for (i in strings.indices) {
                      val orig = strings[i]
                      if (replacements.containsKey(orig)) {
                          strings[i] = replacements[orig]!!
                      }
                  }

                  val newStringsData = ByteArrayOutputStream()
                  val newOffsets = IntArray(stringCount)
                  for (i in strings.indices) {
                      newOffsets[i] = newStringsData.size()
                      if (isUtf8) writeUtf8String(newStringsData, strings[i])
                      else writeUtf16String(newStringsData, strings[i])
                  }

                  val stylesDataLen = if (styleCount > 0 && stylesStart > 0) (spChunkSize - stylesStart) else 0
                  val stylesData = if (stylesDataLen > 0) {
                      axmlBytes.copyOfRange(spOffset + stylesStart, spOffset + spChunkSize)
                  } else ByteArray(0)

                  while (newStringsData.size() % 4 != 0) {
                      newStringsData.write(0)
                  }

                  val newStringsStart = 28 + stringCount * 4 + styleCount * 4
                  val newStylesStart = if (styleCount > 0) (newStringsStart + newStringsData.size()) else 0
                  val newSpChunkSize = newStringsStart + newStringsData.size() + stylesData.size

                  val restOffset = spOffset + spChunkSize
                  val restBytes = axmlBytes.copyOfRange(restOffset, axmlBytes.size)

                  val restBuf = ByteBuffer.wrap(restBytes).order(ByteOrder.LITTLE_ENDIAN)
                  var p = 0
                  while (p <= restBytes.size - 8) {
                      if (restBytes[p] == 0x08.toByte() && restBytes[p + 1] == 0x00.toByte() &&
                          restBytes[p + 2] == 0x00.toByte() && restBytes[p + 3] == 0x10.toByte()) {
                          val v = restBuf.getInt(p + 4)
                          if (v == 10000) {
                              restBuf.putInt(p + 4, newVersionCode)
                              break
                          }
                      }
                      p += 4
                  }

                  val totalSize = 8 + newSpChunkSize + restBytes.size
                  val out = ByteBuffer.allocate(totalSize).order(ByteOrder.LITTLE_ENDIAN)
                  out.putInt(0x00080003)
                  out.putInt(totalSize)

                  out.putInt(0x001C0001)
                  out.putInt(newSpChunkSize)
                  out.putInt(stringCount)
                  out.putInt(styleCount)
                  out.putInt(flags)
                  out.putInt(newStringsStart)
                  out.putInt(newStylesStart)
                  for (off in newOffsets) out.putInt(off)
                  out.put(styleOffsetsBytes)
                  out.put(newStringsData.toByteArray())
                  out.put(stylesData)
                  out.put(restBytes)

                  return out.array()
              }

              private fun readUtf8String(data: ByteArray, offset: Int): String {
                  var p = offset
                  val u16 = data[p].toInt() and 0xFF
                  p += if ((u16 and 0x80) != 0) 2 else 1
                  var u8 = data[p].toInt() and 0xFF
                  if ((u8 and 0x80) != 0) {
                      u8 = ((u8 and 0x7F) shl 8) or (data[p + 1].toInt() and 0xFF)
                      p += 2
                  } else {
                      p += 1
                  }
                  return String(data, p, u8, Charsets.UTF_8)
              }

              private fun writeUtf8String(out: ByteArrayOutputStream, s: String) {
                  val u16Len = s.length
                  val utf8 = s.toByteArray(Charsets.UTF_8)
                  val u8Len = utf8.size
                  if (u16Len >= 0x80) {
                      out.write(((u16Len shr 8) or 0x80) and 0xFF)
                      out.write(u16Len and 0xFF)
                  } else {
                      out.write(u16Len)
                  }
                  if (u8Len >= 0x80) {
                      out.write(((u8Len shr 8) or 0x80) and 0xFF)
                      out.write(u8Len and 0xFF)
                  } else {
                      out.write(u8Len)
                  }
                  out.write(utf8)
                  out.write(0)
              }

              private fun readUtf16String(data: ByteArray, offset: Int): String {
                  val buf = ByteBuffer.wrap(data).order(ByteOrder.LITTLE_ENDIAN)
                  var len = buf.getShort(offset).toInt() and 0xFFFF
                  var p = offset + 2
                  if ((len and 0x8000) != 0) {
                      len = ((len and 0x7FFF) shl 16) or (buf.getShort(p).toInt() and 0xFFFF)
                      p += 2
                  }
                  return String(data, p, len * 2, Charsets.UTF_16LE)
              }

              private fun writeUtf16String(out: ByteArrayOutputStream, s: String) {
                  val len = s.length
                  out.write(len and 0xFF)
                  out.write((len shr 8) and 0xFF)
                  out.write(s.toByteArray(Charsets.UTF_16LE))
                  out.write(0)
                  out.write(0)
              }
          }

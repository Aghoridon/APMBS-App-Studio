              .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background: #9CA3AF; border-radius: 50%; transition: 0.2s; }
              input:checked + .slider { background: var(--primary); border-color: var(--primary); }
              input:checked + .slider:before { transform: translateX(20px); background: #fff; }
              .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
              .perm-item { background: var(--bg-input); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
              .perm-item.checked { background: var(--primary-soft); border-color: var(--primary); color: #fff; }
              .perm-item.full { grid-column: span 2; }
              .bottom-footer { position: fixed; bottom: 0; left: 0; right: 0; background: #0D0E12; border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 12px; z-index: 45; }
              .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; }
              .modal-backdrop.open { display: flex; }
              .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 18px; }
              .progress-track { width: 100%; height: 8px; background: var(--bg-input); border-radius: 8px; overflow: hidden; margin: 14px 0 8px; }
              .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366F1, #A855F7); transition: width 0.3s; }
              .sig-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin: 8px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
              .sig-hash { font-family: monospace; font-size: 11px; color: #D1D5DB; word-break: break-all; }
              .dl-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
              .hidden { display: none !important; }
              .toast { position: fixed; top: 66px; left: 50%; transform: translateX(-50%); background: #1F2937; border: 1px solid var(--primary); color: #fff; padding: 9px 16px; border-radius: 24px; font-size: 12.5px; font-weight: 600; z-index: 200; display: none; }
            </style>
          </head>
          <body>
            <div id="toast" class="toast"></div>
            <header class="top-bar">
              <div class="top-left">
                <button class="icon-btn" onclick="openProjectsModal()">☰</button>
                <div class="app-header-title" id="headerTitle">APMBS App Studio</div>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <button class="icon-btn" onclick="openLivePreview()">▶</button>
                <button class="pill-badge accent" onclick="openTemplatesModal()">📂 Templates</button>
                <button class="pill-badge" onclick="openDownloadsScreen()">📥 <span id="dlCountBadge">0</span></button>
              </div>
            </header>

            <div id="wizardView">
              <div class="stepper">
                <div class="stepper-line"></div>
                <div class="step-item active" id="stepNav1" onclick="goStep(1)"><div class="step-circle" id="stepCircle1">1</div><div class="step-label">App</div></div>
                <div class="step-item" id="stepNav2" onclick="goStep(2)"><div class="step-circle" id="stepCircle2">2</div><div class="step-label">Look</div></div>
                <div class="step-item" id="stepNav3" onclick="goStep(3)"><div class="step-circle" id="stepCircle3">3</div><div class="step-label">Features</div></div>
                <div class="step-item" id="stepNav4" onclick="goStep(4)"><div class="step-circle" id="stepCircle4">4</div><div class="step-label">Permissions</div></div>
                <div class="step-item" id="stepNav5" onclick="goStep(5)"><div class="step-circle" id="stepCircle5">5</div><div class="step-label">Finish</div></div>
              </div>

              <div class="container">
                <div id="step1">
                  <div class="section-title">Your app (100% Offline Engine)</div>
                  <div class="card">
                    <label class="field-label">Converter Mode *</label>
                    <div class="mode-grid">
                      <div class="mode-box" data-mode="Website" onclick="selectMode('Website')">🌐<br><small>Website</small></div>
                      <div class="mode-box" data-mode="Offline ZIP" onclick="selectMode('Offline ZIP')">📦<br><small>Offline ZIP</small></div>
                      <div class="mode-box active" data-mode="HTML" onclick="selectMode('HTML')">&lt;/&gt;<br><small>HTML</small></div>
                    </div>
                    <div id="websiteInputWrap" class="hidden" style="margin-bottom:12px;">
                      <label class="field-label">Website URL *</label>
                      <input type="text" id="websiteUrl" placeholder="https://example.com" oninput="syncState()" />
                    </div>
                    <div id="htmlInputWrap">
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                        <label class="field-label" style="margin:0;">Provide your HTML Code</label>
                        <button class="pill-badge accent" onclick="pasteFromClipboard()">📋 Paste</button>
                      </div>
                      <textarea id="htmlCode" class="code-editor" placeholder="Paste your HTML code here..." oninput="updateCodeStatus()"></textarea>
                      <div class="btn-row">
                        <label class="btn" style="cursor:pointer;">📁 Upload HTML<input type="file" accept=".html,.htm,.txt" style="display:none;" onchange="handleFileUpload(event)" /></label>
                        <button class="btn" onclick="copyHtmlCode()">📄 Copy</button>
                        <button class="btn btn-outline-primary" onclick="saveCurrentAsTemplate()">⭐ Save Template</button>
                      </div>
                      <div id="codeStatus" style="font-size:12px;color:var(--success);margin-top:8px;font-weight:600;">✅ index.html loaded</div>
                    </div>
                    <div style="margin-top:14px;">
                      <label class="field-label">App Name *</label>
                      <input type="text" id="appName" value="APMBS vaidik kundli pro" oninput="onAppNameChange()" />
                    </div>
                  </div>

                  <div class="section-title">App Icon</div>
                  <div class="card" style="text-align:center;">
                    <img id="appIconPreview" class="app-icon-circle" alt="Icon" />
                    <div class="btn-row" style="justify-content:center;">
                      <label class="btn btn-primary" style="max-width:200px;cursor:pointer;">CHOOSE IMAGE<input type="file" accept="image/*" style="display:none;" onchange="handleIconUpload(event)" /></label>
                      <button class="btn" style="max-width:160px;" onclick="resetAutoIcon()">Auto Generate</button>
                    </div>
                  </div>

                  <div class="section-title">App Details</div>
                  <div class="card">
                    <label class="field-label">Package Name *</label>
                    <div style="display:flex;gap:8px;">
                      <input type="text" id="packageName" value="com.apmbs.vaidikkundlipro" readonly />
                      <button class="icon-btn" onclick="togglePackageLock()" id="pkgLockBtn">🔒</button>
                    </div>
                    <div style="margin-top:12px;">
                      <label class="field-label">Version *</label>
                      <div style="display:flex;gap:8px;">
                        <input type="text" id="appVersion" value="1.0.6" oninput="syncState()" />
                        <button class="btn" style="flex:0 0 auto;" onclick="bumpVersion()">+0.0.1</button>
                      </div>
                    </div>
                  </div>
                </div>

                <div id="step2" class="hidden">
                  <div class="section-title">How it looks</div>
                  <div class="card">
                    <div class="toggle-row">
                      <div><b>Enable Splash Screen</b></div>
                      <label class="switch"><input type="checkbox" id="enableSplash" checked onchange="syncState()"><span class="slider"></span></label>
                    </div>
                    <div style="display:flex;gap:10px;margin-top:10px;">
                      <div style="flex:1;"><label class="field-label">Splash BG</label><input type="color" id="splashBgColor" value="#0D0E12" style="height:40px;" onchange="syncState()" /></div>
                      <div style="flex:1;"><label class="field-label">Splash Text</label><input type="color" id="splashTextColor" value="#FFFFFF" style="height:40px;" onchange="syncState()" /></div>
                    </div>
                    <div style="margin-top:12px;">
                      <label class="field-label">Screen Orientation</label>
                      <div class="seg-group">
                        <div class="seg-btn active" onclick="setSeg('orientation','Portrait',this)">Portrait</div>
                        <div class="seg-btn" onclick="setSeg('orientation','Auto',this)">Auto</div>
                        <div class="seg-btn" onclick="setSeg('orientation','Landscape',this)">Landscape</div>
                      </div>
                    </div>
                    <div class="toggle-row"><div><b>Keep text size fixed</b></div><label class="switch"><input type="checkbox" id="fixedTextSize" checked onchange="syncState()"><span class="slider"></span></label></div>
                    <div class="toggle-row"><div><b>Fullscreen Mode</b></div><label class="switch"><input type="checkbox" id="fullscreenMode" onchange="syncState()"><span class="slider"></span></label></div>
                    <div class="toggle-row"><div><b>Enable WebView Zoom</b></div><label class="switch"><input type="checkbox" id="enableZoom" checked onchange="syncState()"><span class="slider"></span></label></div>
                  </div>
                </div>

                <div id="step3" class="hidden">
                  <div class="section-title">Features & Security</div>
                  <div class="card">
                    <div class="toggle-row"><div><b>Copy Protection</b></div><label class="switch"><input type="checkbox" id="copyProtection" checked onchange="syncState()"><span class="slider"></span></label></div>
                    <div style="margin-top:10px;"><label class="field-label">App PIN Lock (4 digits, optional)</label><input type="text" id="appPinLock" maxlength="4" placeholder="Leave empty for no PIN" oninput="syncState()" /></div>
                    <div style="margin-top:10px;"><label class="field-label">What's New Message (optional)</label><input type="text" id="whatsNewMsg" placeholder="e.g., Added D60 PDF report!" oninput="syncState()" /></div>
                  </div>
                </div>

                <div id="step4" class="hidden">
                  <div class="section-title">App Permissions</div>
                  <div class="card">
                    <div class="perm-grid">
                      <div class="perm-item checked" data-perm="STORAGE" onclick="togglePerm(this)">☑️ Storage</div>
                      <div class="perm-item checked" data-perm="SAF" onclick="togglePerm(this)">☑️ Native Folder (SAF)</div>
                      <div class="perm-item" data-perm="BIOMETRIC" onclick="togglePerm(this)">⬜ Fingerprint</div>
                      <div class="perm-item" data-perm="VIBRATE" onclick="togglePerm(this)">⬜ Vibrate</div>
                      <div class="perm-item" data-perm="CAMERA" onclick="togglePerm(this)">⬜ Camera</div>
                      <div class="perm-item" data-perm="LOCATION" onclick="togglePerm(this)">⬜ Location</div>
                    </div>
                  </div>
                </div>

                <div id="step5" class="hidden">
                  <div class="section-title">Ready to build (100% Offline)</div>
                  <div class="card">
                    <div style="font-size:18px;font-weight:700;" id="summaryAppName">APMBS vaidik kundli pro</div>
                    <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:8px;" id="summarySub">HTML • version 1.0.6</div>
                    <div class="field-hint">Package: <b id="summaryPkg">com.apmbs.vaidikkundlipro</b></div>
                  </div>
                  <div class="card">
                    <div class="perm-item checked full">🔘 Unique RSA-2048 Offline Signing Key</div>
                    <div class="btn-row"><button class="btn" onclick="backupSigningKey()">🔑 Save backup of my key (.p12)</button></div>
                  </div>
                  <button class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;" onclick="startOfflineApkBuild()">🚀 Generate Real APK (Offline)</button>
                </div>
              </div>

              <div class="bottom-footer">
                <button class="btn" id="prevBtn" onclick="prevStep()">Back</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">Continue</button>
              </div>
               </div>

            <div id="downloadsView" class="hidden">
              <div class="container">
                <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0;">
                  <div class="section-title" style="margin:0;">Downloads & APKs</div>
                  <button class="pill-badge accent" onclick="closeDownloadsScreen()">← Back</button>
                </div>
                <div id="downloadsListContainer"></div>
              </div>
            </div>

            <div id="buildProgressModal" class="modal-backdrop"><div class="modal-box">
              <div style="font-size:18px;font-weight:700;">🚀 Generating Real Signed APK</div>
              <div class="progress-track"><div class="progress-fill" id="buildProgressBar"></div></div>
              <div id="buildStatusText" style="font-size:13px;color:#A5B4FC;font-weight:600;">Starting...</div>
            </div></div>

            <div id="buildSuccessModal" class="modal-backdrop"><div class="modal-box">
              <div style="font-size:19px;font-weight:800;color:var(--success);margin-bottom:6px;">✅ APK Generated Successfully!</div>
              <div style="background:var(--bg-input);padding:10px;border-radius:10px;font-size:13px;font-weight:700;margin-bottom:10px;">
                📦 <span id="resApkFilename">app.apk</span><br><span style="font-size:11.5px;color:var(--text-muted);">📁 Saved to Downloads/APMBS_App_Studio</span>
              </div>
              <div style="font-size:11px;color:var(--text-muted);">SHA-1</div>
              <div class="sig-box"><div class="sig-hash" id="resSha1"></div><button class="pill-badge accent" onclick="copyTextById('resSha1')">COPY</button></div>
              <div style="font-size:11px;color:var(--text-muted);">SHA-256</div>
              <div class="sig-box"><div class="sig-hash" id="resSha256"></div><button class="pill-badge accent" onclick="copyTextById('resSha256')">COPY</button></div>
              <button class="btn btn-primary" style="width:100%;margin-top:10px;padding:12px;" onclick="installLatestApk()">📲 INSTALL APK NOW</button>
              <div class="btn-row">
                <button class="btn btn-success" onclick="shareLatestApk()">📤 SHARE APK</button>
                <button class="btn btn-outline-primary" onclick="closeSuccessAndOpenDownloads()">📥 DOWNLOADS</button>
                <button class="btn" onclick="closeModal('buildSuccessModal')">OK</button>
              </div>
            </div></div>

            <div id="templatesModal" class="modal-backdrop"><div class="modal-box">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><b>📂 Templates</b><button class="icon-btn" onclick="closeModal('templatesModal')">✕</button></div>
              <div id="templatesList"></div>
              <label class="btn btn-outline-primary" style="width:100%;margin-top:10px;cursor:pointer;">➕ Import Template (.html/.json)<input type="file" accept=".html,.htm,.json" style="display:none;" onchange="importNewTemplate(event)" /></label>
            </div></div>

            <div id="projectsModal" class="modal-backdrop"><div class="modal-box">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><b>📱 My Projects</b><button class="icon-btn" onclick="closeModal('projectsModal')">✕</button></div>
              <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="createNewProject()">+ New App Project</button>
              <div id="projectsList"></div>
            </div></div>

            <div id="previewModal" class="modal-backdrop"><div class="modal-box" style="max-width:350px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><b>📱 Live Preview</b><button class="icon-btn" onclick="closeModal('previewModal')">✕</button></div>
              <iframe id="previewIframe" style="width:100%;height:480px;border:2px solid var(--border);border-radius:16px;background:#fff;"></iframe>
            </div></div>

          <script>
            const DEFAULT_TEMPLATES = [
              { id: "tpl_astro", name: "वैदिक ज्योतिष एवं कुंडली (Astrology + PDF)", desc: "जन्म विवरण और PDF प्रिंट", code: `<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:sans-serif;background:#120d1d;color:#fff;padding:16px}.card{background:#1e1633;padding:16px;border-radius:14px}input,button{width:100%;padding:11px;margin-top:8px;border-radius:8px;border:1px solid #4c3b7a;background:#120d1d;color:#fff;box-sizing:border-box}button{background:#d97706;border:none;font-weight:bold}</style></head><body><div class="card"><h2 style="color:#fbbf24">🕉️ APMBS वैदिक कुंडली</h2><input id="n" placeholder="जातक का नाम"><input id="d" type="date"><input id="t" type="time"><input id="p" placeholder="जन्म स्थान"><button onclick="show()">कुंडली देखें</button><div id="o" style="margin-top:12px"></div></div><script>function show(){o.innerHTML='<b>नाम:</b> '+n.value+'<br><b>तारीख:</b> '+d.value+' '+t.value+'<br><b>स्थान:</b> '+p.value+'<br><button onclick="window.print()" style="background:#10b981;margin-top:8px">PDF प्रिंट करें</button>';}<\/script></body></html>` },
              { id: "tpl_ebook", name: "ई-बुक एवं ग्रंथ रीडर (E-Book)", desc: "फ़ॉन्ट साइज़ और डार्क/लाइट थीम", code: `<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Georgia,serif;background:#fbf7f0;color:#2c221e;padding:18px;line-height:1.8}.dark{background:#121316;color:#eee}button{padding:8px 14px;margin-right:6px}</style></head><body><button onclick="s+=2;t.style.fontSize=s+'px'">A+</button><button onclick="s-=2;t.style.fontSize=s+'px'">A-</button><button onclick="document.body.classList.toggle('dark')">थीम</button><h2>अध्याय १</h2><p id="t" style="font-size:18px">यहाँ अपना पाठ लिखें।</p><script>let s=18;<\/script></body></html>` },
              { id: "tpl_biz", name: "बिज़नेस एवं परामर्श ऐप", desc: "WhatsApp संपर्क और सेवाएं", code: `<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:sans-serif;background:#0f172a;color:#fff;padding:16px}.card{background:#1e293b;padding:16px;border-radius:14px}a{display:block;text-align:center;background:#25D366;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:12px}</style></head><body><div class="card"><h2>🌟 परामर्श केंद्र</h2><a href="https://wa.me/?text=नमस्ते">💬 WhatsApp पर जुड़ें</a></div></body></html>` }
            ];
            let currentStep = 1, pkgLocked = true, currentProjectId = "proj_kundli", latestApkName = "";
            let state = { id: currentProjectId, mode: "HTML", websiteUrl: "", htmlCode: DEFAULT_TEMPLATES[0].code, appName: "APMBS vaidik kundli pro", iconDataUrl: "", packageName: "com.apmbs.vaidikkundlipro", version: "1.0.6", enableSplash: true, splashBgColor: "#0D0E12", splashTextColor: "#FFFFFF", orientation: "Portrait", fixedTextSize: true, fullscreenMode: false, enableZoom: true, copyProtection: true, appPinLock: "", whatsNewMsg: "", permissions: ["STORAGE", "SAF"] };

            window.addEventListener("DOMContentLoaded", () => {
              const all = JSON.parse(localStorage.getItem("apmbs_projects") || "{}");
              if (all[currentProjectId]) state = { ...state, ...all[currentProjectId] };
              if (!state.iconDataUrl) state.iconDataUrl = generateAutoIcon(state.appName);
              applyStateToForm(); renderDownloadsList();
            });
            function showToast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(window._tt); window._tt = setTimeout(() => t.style.display = "none", 2600); }
            function goStep(step) {
              syncState(); currentStep = step;
              for (let i = 1; i <= 5; i++) {
                document.getElementById("step" + i).classList.toggle("hidden", i !== step);
                const nav = document.getElementById("stepNav" + i), c = document.getElementById("stepCircle" + i);
                nav.classList.remove("active", "done");
                if (i < step) { nav.classList.add("done"); c.textContent = "✓"; }
                else if (i === step) { nav.classList.add("active"); c.textContent = i; }
                else c.textContent = i;
              }
              document.getElementById("prevBtn").style.visibility = step === 1 ? "hidden" : "visible";
              document.getElementById("nextBtn").textContent = step === 5 ? "🚀 Generate APK" : "Continue";
              if (step === 5) { document.getElementById("summaryAppName").textContent = state.appName; document.getElementById("summarySub").textContent = `${state.mode} • version ${state.version}`; document.getElementById("summaryPkg").textContent = state.packageName; }
            }
                   function nextStep() { if (currentStep < 5) goStep(currentStep + 1); else startOfflineApkBuild(); }
            function prevStep() { if (currentStep > 1) goStep(currentStep - 1); }
            function selectMode(mode) { state.mode = mode; document.querySelectorAll(".mode-box").forEach(b => b.classList.toggle("active", b.dataset.mode === mode)); document.getElementById("websiteInputWrap").classList.toggle("hidden", mode !== "Website"); document.getElementById("htmlInputWrap").classList.toggle("hidden", mode === "Website"); saveProject(); }
            function updateCodeStatus() { state.htmlCode = document.getElementById("htmlCode").value; document.getElementById("codeStatus").textContent = `✅ index.html loaded (${(new Blob([state.htmlCode]).size / 1024).toFixed(1)} KB)`; saveProject(); }
            async function pasteFromClipboard() { try { document.getElementById("htmlCode").value = await navigator.clipboard.readText(); updateCodeStatus(); showToast("📋 Pasted!"); } catch (e) { showToast("Long-press box and tap Paste"); } }
            function handleFileUpload(e) { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { document.getElementById("htmlCode").value = r.result; updateCodeStatus(); showToast("✅ Loaded!"); }; r.readAsText(f); }
            function copyHtmlCode() { navigator.clipboard.writeText(document.getElementById("htmlCode").value); showToast("📄 Copied!"); }
            function onAppNameChange() { state.appName = document.getElementById("appName").value.trim() || "APMBS App"; document.getElementById("headerTitle").textContent = state.appName; if (!pkgLocked) { state.packageName = "com.apmbs." + (state.appName.toLowerCase().replace(/[^a-z0-9]/g, "") || "app"); document.getElementById("packageName").value = state.packageName; } saveProject(); }
            function togglePackageLock() { pkgLocked = !pkgLocked; document.getElementById("packageName").readOnly = pkgLocked; document.getElementById("pkgLockBtn").textContent = pkgLocked ? "🔒" : "🔓"; }
            function bumpVersion() { const p = (document.getElementById("appVersion").value || "1.0.0").split(".").map(n => parseInt(n, 10) || 0); p[2] = (p[2] || 0) + 1; document.getElementById("appVersion").value = p.join("."); syncState(); }
            function generateAutoIcon(name) { const c = document.createElement("canvas"); c.width = 512; c.height = 512; const ctx = c.getContext("2d"); ctx.fillStyle = "#4F46E5"; ctx.fillRect(0, 0, 512, 512); ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 220px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText((name || "A").slice(0, 2).toUpperCase(), 256, 270); return c.toDataURL("image/png"); }
            function resetAutoIcon() { state.iconDataUrl = generateAutoIcon(state.appName); document.getElementById("appIconPreview").src = state.iconDataUrl; saveProject(); }
            function handleIconUpload(e) { const f = e.target.files[0]; if (!f) return; const img = new Image(); img.onload = () => { const c = document.createElement("canvas"); c.width = 512; c.height = 512; const ctx = c.getContext("2d"); const s = Math.min(img.width, img.height); ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 512, 512); state.iconDataUrl = c.toDataURL("image/png"); document.getElementById("appIconPreview").src = state.iconDataUrl; saveProject(); showToast("✅ 512x512 Icon set!"); }; img.src = URL.createObjectURL(f); }
            function setSeg(k, v, el) { state[k] = v; el.parentElement.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active")); el.classList.add("active"); saveProject(); }
            function togglePerm(el) { el.classList.toggle("checked"); const lbl = el.textContent.replace(/^☑️|^⬜/, "").trim(); el.textContent = (el.classList.contains("checked") ? "☑️ " : "⬜ ") + lbl; syncState(); }
            function syncState() { state.websiteUrl = document.getElementById("websiteUrl").value; state.htmlCode = document.getElementById("htmlCode").value; state.appName = document.getElementById("appName").value; state.packageName = document.getElementById("packageName").value; state.version = document.getElementById("appVersion").value; state.enableSplash = document.getElementById("enableSplash").checked; state.splashBgColor = document.getElementById("splashBgColor").value; state.splashTextColor = document.getElementById("splashTextColor").value; state.fixedTextSize = document.getElementById("fixedTextSize").checked; state.fullscreenMode = document.getElementById("fullscreenMode").checked; state.enableZoom = document.getElementById("enableZoom").checked; state.copyProtection = document.getElementById("copyProtection").checked; state.appPinLock = document.getElementById("appPinLock").value; state.whatsNewMsg = document.getElementById("whatsNewMsg").value; state.permissions = Array.from(document.querySelectorAll(".perm-item.checked")).map(e => e.dataset.perm); saveProject(); }
            function applyStateToForm() { document.getElementById("headerTitle").textContent = state.appName; document.getElementById("websiteUrl").value = state.websiteUrl || ""; document.getElementById("htmlCode").value = state.htmlCode || ""; document.getElementById("appName").value = state.appName; document.getElementById("appIconPreview").src = state.iconDataUrl; document.getElementById("packageName").value = state.packageName; document.getElementById("appVersion").value = state.version; document.getElementById("enableSplash").checked = state.enableSplash; document.getElementById("splashBgColor").value = state.splashBgColor; document.getElementById("splashTextColor").value = state.splashTextColor; document.getElementById("fixedTextSize").checked = state.fixedTextSize; document.getElementById("fullscreenMode").checked = state.fullscreenMode; document.getElementById("enableZoom").checked = state.enableZoom; document.getElementById("copyProtection").checked = state.copyProtection; document.getElementById("appPinLock").value = state.appPinLock || ""; document.getElementById("whatsNewMsg").value = state.whatsNewMsg || ""; selectMode(state.mode || "HTML"); updateCodeStatus(); }
            function buildWrappedHtml() { const bridge = `<script>window.WebToApk={vibrate:function(m){if(window.AndroidBridge)AndroidBridge.vibrate(m||50)},shareText:function(t){if(window.AndroidBridge)AndroidBridge.shareText(t)},authenticateBiometric:function(cb){window.onBiometricSuccess=cb;if(window.AndroidBridge)AndroidBridge.authBio()},saveFile:function(n,b){if(window.AndroidBridge)AndroidBridge.saveFile(n,b)}};<\/script>`; const raw = state.htmlCode || "<h1>APMBS App</h1>"; return raw.includes("</body>") ? raw.replace("</body>", bridge + "</body>") : raw + bridge; }
            function startOfflineApkBuild() { syncState(); document.getElementById("buildProgressBar").style.width = "10%"; document.getElementById("buildStatusText").textContent = "Starting 100% Offline Kotlin Compiler..."; document.getElementById("buildProgressModal").classList.add("open"); if (window.StudioNative && window.StudioNative.buildOfflineApk) window.StudioNative.buildOfflineApk(JSON.stringify(state), buildWrappedHtml()); }
            window.onNativeBuildProgress = function(pct, msg) { document.getElementById("buildProgressBar").style.width = pct + "%"; document.getElementById("buildStatusText").textContent = msg; };
            window.onNativeBuildComplete = function(res) { document.getElementById("buildProgressModal").classList.remove("open"); latestApkName = res.apkFileName; document.getElementById("resApkFilename").textContent = res.apkFileName; document.getElementById("resSha1").textContent = res.sha1; document.getElementById("resSha256").textContent = res.sha256; const list = JSON.parse(localStorage.getItem("apmbs_downloads") || "[]"); list.unshift({ id: "dl_" + Date.now(), title: res.apkFileName, meta: `Signed APK • ${res.sizeKb} KB`, date: new Date().toLocaleString() }); localStorage.setItem("apmbs_downloads", JSON.stringify(list)); renderDownloadsList(); document.getElementById("buildSuccessModal").classList.add("open"); };
            window.onNativeBuildError = function(err) { document.getElementById("buildProgressModal").classList.remove("open"); alert("Build Error: " + err); };
            function installLatestApk() { if (window.StudioNative && latestApkName) window.StudioNative.installApk(latestApkName); }
            function shareLatestApk() { if (window.StudioNative && latestApkName) window.StudioNative.shareApkFile(latestApkName, ""); }
            function backupSigningKey() { if (window.StudioNative) window.StudioNative.exportKeystoreP12(state.packageName, state.appName); }
            function closeSuccessAndOpenDownloads() { closeModal("buildSuccessModal"); openDownloadsScreen(); }
            function openDownloadsScreen() { document.getElementById("wizardView").classList.add("hidden"); document.getElementById("downloadsView").classList.remove("hidden"); renderDownloadsList(); }
            function closeDownloadsScreen() { document.getElementById("downloadsView").classList.add("hidden"); document.getElementById("wizardView").classList.remove("hidden"); }
            function renderDownloadsList() { const list = JSON.parse(localStorage.getItem("apmbs_downloads") || "[]"); document.getElementById("dlCountBadge").textContent = list.length; const c = document.getElementById("downloadsListContainer"); if (!list.length) { c.innerHTML = `<div class="card" style="text-align:center;color:var(--text-muted);">No APKs built yet.</div>`; return; } c.innerHTML = list.map(item => `<div class="dl-card"><div style="font-size:13.5px;font-weight:700;">${item.title}</div><div style="font-size:11.5px;color:#A5B4FC;margin:4px 0;">${item.meta} • ${item.date}</div><div class="btn-row"><button class="btn btn-primary" onclick="StudioNative.installApk('${item.title}')">📲 Install</button><button class="btn" style="background:#25D366;border:none;flex:0 0 44px;" onclick="StudioNative.shareApkFile('${item.title}','wa')">💬</button><button class="btn" style="background:#229ED9;border:none;flex:0 0 44px;" onclick="StudioNative.shareApkFile('${item.title}','tg')">✈️</button><button class="btn" style="flex:0 0 44px;" onclick="deleteDl('${item.id}')">🗑️</button></div></div>`).join(""); }
            function deleteDl(id) { localStorage.setItem("apmbs_downloads", JSON.stringify(JSON.parse(localStorage.getItem("apmbs_downloads") || "[]").filter(x => x.id !== id))); renderDownloadsList(); }
            function openTemplatesModal() { const all = [...DEFAULT_TEMPLATES, ...JSON.parse(localStorage.getItem("apmbs_custom_templates") || "[]")]; document.getElementById("templatesList").innerHTML = all.map(t => `<div class="dl-card" style="cursor:pointer;" onclick="applyTpl('${t.id}')"><b style="color:#A5B4FC;">${t.name}</b><div class="field-hint">${t.desc}</div></div>`).join(""); document.getElementById("templatesModal").classList.add("open"); }
            function applyTpl(id) { const t = [...DEFAULT_TEMPLATES, ...JSON.parse(localStorage.getItem("apmbs_custom_templates") || "[]")].find(x => x.id === id); if (!t) return; selectMode("HTML"); document.getElementById("htmlCode").value = t.code; updateCodeStatus(); closeModal("templatesModal"); showToast("✅ Template loaded!"); }
            function saveCurrentAsTemplate() { const name = prompt("Template Name:"); if (!name) return; const custom = JSON.parse(localStorage.getItem("apmbs_custom_templates") || "[]"); custom.push({ id: "tpl_" + Date.now(), name, desc: "Saved template", code: document.getElementById("htmlCode").value }); localStorage.setItem("apmbs_custom_templates", JSON.stringify(custom)); showToast("⭐ Saved!"); }
            function importNewTemplate(e) { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const custom = JSON.parse(localStorage.getItem("apmbs_custom_templates") || "[]"); custom.push({ id: "tpl_" + Date.now(), name: f.name, desc: "Imported template", code: r.result }); localStorage.setItem("apmbs_custom_templates", JSON.stringify(custom)); openTemplatesModal(); }; r.readAsText(f); }
            function saveProject() { const all = JSON.parse(localStorage.getItem("apmbs_projects") || "{}"); all[state.id] = state; localStorage.setItem("apmbs_projects", JSON.stringify(all)); }
            function openProjectsModal() { const all = Object.values(JSON.parse(localStorage.getItem("apmbs_projects") || "{}")); document.getElementById("projectsList").innerHTML = all.map(p => `<div class="dl-card" onclick="switchProj('${p.id}')" style="cursor:pointer;"><b>${p.appName}</b> (v${p.version})<div class="field-hint">${p.packageName}</div></div>`).join(""); document.getElementById("projectsModal").classList.add("open"); }
            function switchProj(id) { const all = JSON.parse(localStorage.getItem("apmbs_projects") || "{}"); if (all[id]) { state = all[id]; currentProjectId = id; applyStateToForm(); closeModal("projectsModal"); goStep(1); } }
            function createNewProject() { const name = prompt("New App Name:", "My New App"); if (!name) return; state = { ...state, id: "proj_" + Date.now(), appName: name, packageName: "com.apmbs." + (name.toLowerCase().replace(/[^a-z0-9]/g, "") || "app"), version: "1.0.0", iconDataUrl: generateAutoIcon(name), htmlCode: DEFAULT_TEMPLATES[2].code }; saveProject(); applyStateToForm(); closeModal("projectsModal"); goStep(1); }
            function openLivePreview() { syncState(); document.getElementById("previewIframe").srcdoc = buildWrappedHtml(); document.getElementById("previewModal").classList.add("open"); }
            function closeModal(id) { document.getElementById(id).classList.remove("open"); }
            function copyTextById(id) { navigator.clipboard.writeText(document.getElementById(id).textContent); showToast("📋 Copied!"); }
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Compile APMBS App Studio APK
        working-directory: studio
        run: gradle assembleRelease

      - name: Upload APMBS App Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: APMBS_App_Studio_v1.0.0
          path: studio/app/build/outputs/apk/release/app-release.apk
          
        

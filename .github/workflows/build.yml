          cat << 'KOTLINEOF' > studio/app/src/main/java/com/apmbs/appstudio/OfflineApkBuilder.kt
          package com.apmbs.appstudio

          import android.content.ContentValues
          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.Base64
          import com.android.apksig.ApkSigner
          import org.json.JSONObject
          import java.io.*
          import java.util.zip.*

          object OfflineApkBuilder {

              class CountingOutputStream(out: OutputStream) : FilterOutputStream(out) {
                  var count: Long = 0
                  override fun write(b: Int) {
                      out.write(b)
                      count++
                  }
                  override fun write(b: ByteArray, off: Int, len: Int) {
                      out.write(b, off, len)
                      count += len
                  }
              }

              fun buildSignedApk(
                  context: Context,
                  configJsonStr: String,
                  finalHtmlStr: String,
                  onProgress: (Int, String) -> Unit
              ): JSONObject {
                  val cfg = JSONObject(configJsonStr)
                  val appName = cfg.optString("appName", "APMBS App").trim()
                  val packageName = cfg.optString("packageName", "com.apmbs.customapp").trim()
                  val versionName = cfg.optString("version", "1.0.0").trim()
                  val parts = versionName.split(".").map { it.toIntOrNull() ?: 0 }
                  val versionCode = (parts.getOrElse(0) { 1 }) * 10000 + (parts.getOrElse(1) { 0 }) * 100 + (parts.getOrElse(2) { 0 })
                  val iconDataUrl = cfg.optString("iconDataUrl", "")

                  onProgress(20, "Generating RSA-2048 Keystore & SHA-256 Certificate...")
                  val keyMaterial = KeystoreManager.getOrCreateKeystore(context, packageName, appName)

                  onProgress(45, "Patching Binary AndroidManifest.xml & App Icon...")
                  val workDir = File(context.cacheDir, "apk_build_${System.currentTimeMillis()}").apply { mkdirs() }
                  val unsignedApk = File(workDir, "unsigned.apk")

                  val customIconBytes: ByteArray? = if (iconDataUrl.contains(",")) {
                      try { Base64.decode(iconDataUrl.substringAfter(","), Base64.DEFAULT) } catch (e: Exception) { null }
                  } else null

                  val cos = CountingOutputStream(BufferedOutputStream(FileOutputStream(unsignedApk)))
                  val zos = ZipOutputStream(cos)

                  context.assets.open("base_template.apk").use { rawIn ->
                      val zis = ZipInputStream(BufferedInputStream(rawIn))
                      var entry: ZipEntry? = zis.nextEntry
                      while (entry != null) {
                          val name = entry.name
                          if (!entry.isDirectory && !name.startsWith("META-INF/")) {
                              val rawBytes = zis.readBytes()
                              val outBytes = when {
                                  name == "AndroidManifest.xml" -> {
                                      AxmlPatcher.patchManifest(
                                          rawBytes,
                                          mapOf(
                                              "com.apmbs.templateapp" to packageName,
                                              "APMBS_APP_LABEL_PLACEHOLDER" to appName,
                                              "1.0.0" to versionName
                                          ),
                                          versionCode
                                      )
                                  }
                                  name == "assets/index.html" -> finalHtmlStr.toByteArray(Charsets.UTF_8)
                                  name == "assets/app_config.json" -> configJsonStr.toByteArray(Charsets.UTF_8)
                                  customIconBytes != null && name.contains("ic_launcher") && name.endsWith(".png") -> customIconBytes
                                  else -> rawBytes
                              }

                              if (name == "resources.arsc") {
                                  val nameBytes = name.toByteArray(Charsets.UTF_8)
                                  val headerBase = cos.count + 30 + nameBytes.size
                                  val pad = ((4 - (headerBase % 4)) % 4).toInt()
                                  val ze = ZipEntry(name).apply {
                                      method = ZipEntry.STORED
                                      size = outBytes.size.toLong()
                                      compressedSize = outBytes.size.toLong()
                                      crc = computeCrc32(outBytes)
                                      if (pad > 0) extra = ByteArray(pad)
                                  }
                                  zos.putNextEntry(ze)
                                  zos.write(outBytes)
                                  zos.closeEntry()
                              } else {
                                  zos.putNextEntry(ZipEntry(name))
                                  zos.write(outBytes)
                                  zos.closeEntry()
                              }
                          }
                          zis.closeEntry()
                          entry = zis.nextEntry
                      }
                  }
                  zos.close()

                  onProgress(75, "Signing APK with v1 + v2 Digital Signature...")
                  val buildsDir = File(context.getExternalFilesDir(null), "builds").apply { mkdirs() }
                  val cleanName = appName.replace(Regex("[^a-zA-Z0-9]"), "_")
                  val stamp = System.currentTimeMillis()
                  val apkFileName = "${cleanName}_v${versionName}_${stamp}.apk"
                  val signedApk = File(buildsDir, apkFileName)

                  val signerConfig = ApkSigner.SignerConfig.Builder(
                      "CERT",
                      keyMaterial.privateKey,
                      listOf(keyMaterial.certificate)
                  ).build()

                  val apkSigner = ApkSigner.Builder(listOf(signerConfig))
                      .setInputApk(unsignedApk)
                      .setOutputApk(signedApk)
                      .setV1SigningEnabled(true)
                      .setV2SigningEnabled(true)
                      .setV3SigningEnabled(false)
                      .build()
                  apkSigner.sign()

                  onProgress(92, "Saving APK & Certificate to Downloads...")
                  copyToPublicDownloads(context, signedApk, apkFileName, "application/vnd.android.package-archive")

                  val certFileName = "${cleanName.lowercase()}_upload_cert.pem"
                  val certTemp = File(workDir, certFileName).apply { writeText(keyMaterial.certPem) }
                  copyToPublicDownloads(context, certTemp, certFileName, "application/x-pem-file")

                  workDir.deleteRecursively()
                  onProgress(100, "Build Complete!")

                  return JSONObject().apply {
                      put("success", true)
                      put("apkFileName", apkFileName)
                      put("apkPath", signedApk.absolutePath)
                      put("sizeKb", signedApk.length() / 1024)
                      put("sha1", keyMaterial.sha1)
                      put("sha256", keyMaterial.sha256)
                      put("certPem", keyMaterial.certPem)
                      put("p12Path", keyMaterial.p12File.absolutePath)
                  }
              }

              private fun computeCrc32(data: ByteArray): Long {
                  val crc = CRC32()
                  crc.update(data)
                  return crc.value
              }

              fun copyToPublicDownloads(context: Context, srcFile: File, displayName: String, mime: String) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Downloads.DISPLAY_NAME, displayName)
                              put(MediaStore.Downloads.MIME_TYPE, mime)
                              put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/APMBS_App_Studio")
                          }
                          val uri = context.contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                          uri?.let {
                              context.contentResolver.openOutputStream(it)?.use { os ->
                                  FileInputStream(srcFile).use { ins -> ins.copyTo(os) }
                              }
                          }
                      } else {
                          val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "APMBS_App_Studio").apply { mkdirs() }
                          srcFile.copyTo(File(dir, displayName), overwrite = true)
                      }
                  } catch (_: Exception) {}
              }
          }
          KOTLINEOF


              :root { --bg-main:#0D0E12; --bg-card:#161821; --bg-input:#1E212D; --bg-elevated:#252836; --border:#2C3042; --primary:#6366F1; --primary-soft:rgba(99,102,241,0.16); --text-main:#F3F4F6; --text-muted:#9CA3AF; --success:#10B981; }
              * { box-sizing:border-box; margin:0; padding:0; font-family:sans-serif; -webkit-tap-highlight-color:transparent; }
              body { background:var(--bg-main); color:var(--text-main); min-height:100vh; padding-bottom:84px; }
              .top-bar { position:sticky; top:0; z-index:50; background:#0D0E12; border-bottom:1px solid var(--border); padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
              .top-left { display:flex; align-items:center; gap:8px; min-width:0; }
              .icon-btn { background:var(--bg-input); border:1px solid var(--border); color:var(--text-main); width:36px; height:36px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; }
              .app-header-title { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
              .pill-badge { background:var(--bg-input); border:1px solid var(--border); color:var(--text-main); padding:6px 10px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
              .pill-badge.accent { background:var(--primary-soft); border-color:var(--primary); color:#A5B4FC; }
              .stepper { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; position:relative; }
              .step-item { display:flex; flex-direction:column; align-items:center; gap:6px; z-index:2; cursor:pointer; flex:1; }
              .step-circle { width:32px; height:32px; border-radius:50%; background:var(--bg-input); border:2px solid var(--border); color:var(--text-muted); font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
              .step-item.active .step-circle, .step-item.done .step-circle { background:var(--primary); border-color:#818CF8; color:#fff; }
              .step-label { font-size:11px; color:var(--text-muted); font-weight:600; }
              .step-item.active .step-label { color:#A5B4FC; }
              .stepper-line { position:absolute; top:30px; left:12%; right:12%; height:2px; background:var(--border); z-index:1; }
              .container { max-width:680px; margin:0 auto; padding:8px 14px; }
              .section-title { font-size:17px; font-weight:700; margin:10px 0 12px; display:flex; align-items:center; gap:8px; }
              .section-title::before { content:""; width:4px; height:18px; background:var(--primary); border-radius:4px; }
              .card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; }
              .field-label { display:block; font-size:13px; font-weight:600; margin-bottom:8px; }
              .field-hint { font-size:11.5px; color:var(--text-muted); margin-top:4px; line-height:1.4; }
              .mode-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
              .mode-box { background:var(--bg-input); border:1.5px solid var(--border); border-radius:12px; padding:12px 6px; text-align:center; cursor:pointer; }
              .mode-box.active { background:var(--primary-soft); border-color:var(--primary); }
              input[type="text"], input[type="password"], select, textarea { width:100%; background:var(--bg-input); border:1px solid var(--border); color:var(--text-main); border-radius:10px; padding:11px 12px; font-size:14px; outline:none; }
              textarea.code-editor { font-family:monospace; font-size:12.5px; min-height:135px; }
              .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
              .btn { background:var(--bg-input); border:1px solid var(--border); color:var(--text-main); padding:10px 14px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; flex:1; }
              .btn-primary { background:var(--primary); border-color:var(--primary); color:#fff; }
              .btn-success { background:rgba(16,185,129,0.18); border-color:var(--success); color:#6EE7B7; }
              .btn-outline-primary { background:var(--primary-soft); border-color:var(--primary); color:#A5B4FC; }
              .app-icon-circle { width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--primary); }
              .seg-group { display:flex; background:var(--bg-input); border-radius:10px; padding:3px; border:1px solid var(--border); margin-bottom:10px; }
              .seg-btn { flex:1; padding:8px 6px; text-align:center; font-size:12.5px; font-weight:600; border-radius:8px; cursor:pointer; color:var(--text-muted); }
              .seg-btn.active { background:var(--primary); color:#fff; }
              .toggle-row { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid rgba(44,48,66,0.5); gap:12px; }
              .toggle-row:last-child { border-bottom:none; }
              .switch { position:relative; width:44px; height:24px; flex-shrink:0; }
              .switch input { opacity:0; width:0; height:0; }
              .slider { position:absolute; cursor:pointer; inset:0; background:var(--bg-elevated); border:1px solid var(--border); border-radius:24px; transition:0.2s; }
              .slider:before { position:absolute; content:""; height:18px; width:18px; left:2px; bottom:2px; background:#9CA3AF; border-radius:50%; transition:0.2s; }
              input:checked + .slider { background:var(--primary); border-color:var(--primary); }
              input:checked + .slider:before { transform:translateX(20px); background:#fff; }
              .perm-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
              .perm-item { background:var(--bg-input); border:1.5px solid var(--border); border-radius:10px; padding:10px; font-size:12.5px; font-weight:600; cursor:pointer; }
              .perm-item.checked { background:var(--primary-soft); border-color:var(--primary); color:#fff; }
              .perm-item.full { grid-column:span 2; }
              .bottom-footer { position:fixed; bottom:0; left:0; right:0; background:#0D0E12; border-top:1px solid var(--border); padding:12px 16px; display:flex; gap:12px; z-index:45; }
              .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; display:none; align-items:center; justify-content:center; padding:16px; }
              .modal-backdrop.open { display:flex; }
              .modal-box { background:var(--bg-card); border:1px solid var(--border); border-radius:18px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:18px; }
              .progress-track { width:100%; height:8px; background:var(--bg-input); border-radius:8px; overflow:hidden; margin:14px 0 8px; }
              .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#6366F1,#A855F7); transition:width 0.3s; }
              .sig-box { background:var(--bg-input); border:1px solid var(--border); border-radius:10px; padding:10px; margin:8px 0; display:flex; align-items:center; justify-content:space-between; gap:8px; }
              .sig-hash { font-family:monospace; font-size:11px; color:#D1D5DB; word-break:break-all; }
              .dl-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px; }
              .hidden { display:none !important; }
              .toast { position:fixed; top:66px; left:50%; transform:translateX(-50%); background:#1F2937; border:1px solid var(--primary); color:#fff; padding:9px 16px; border-radius:24px; font-size:12.5px; font-weight:600; z-index:200; display:none; }
            </style>
          </head>

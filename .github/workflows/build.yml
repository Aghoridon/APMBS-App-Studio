          package com.apmbs.appstudio

          import android.content.Context
          import android.util.Base64
          import org.bouncycastle.cert.jcajce.JcaX509CertificateConverter
          import org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder
          import org.bouncycastle.operator.jcajce.JcaContentSignerBuilder
          import org.json.JSONObject
          import java.io.ByteArrayInputStream
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.math.BigInteger
          import java.security.KeyPairGenerator
          import java.security.KeyStore
          import java.security.MessageDigest
          import java.security.PrivateKey
          import java.security.cert.X509Certificate
          import java.util.Date
          import javax.security.auth.x500.X500Principal

          object KeystoreManager {
              data class AppKeyMaterial(
                  val privateKey: PrivateKey,
                  val certificate: X509Certificate,
                  val sha1: String,
                  val sha256: String,
                  val certPem: String,
                  val p12File: File
              )

              fun importCustomKeystore(context: Context, packageName: String, p12Base64: String, passwordStr: String, aliasInput: String): String {
                  val dir = File(context.filesDir, "keystores").apply { mkdirs() }
                  val safePkg = packageName.replace(Regex("[^a-zA-Z0-9._-]"), "_")
                  val p12File = File(dir, "$safePkg.p12")
                  val metaFile = File(dir, "$safePkg.meta.json")
                  val bytes = Base64.decode(p12Base64.substringAfter(","), Base64.DEFAULT)
                  val pass = passwordStr.toCharArray()

                  val ks = KeyStore.getInstance("PKCS12")
                  ks.load(ByteArrayInputStream(bytes), pass)
                  val alias = if (aliasInput.isNotBlank() && ks.containsAlias(aliasInput)) aliasInput
                  else ks.aliases().toList().firstOrNull { ks.isKeyEntry(it) } ?: throw Exception("No private key entry found in .p12")

                  FileOutputStream(p12File).use { it.write(bytes) }
                  val meta = JSONObject().apply { put("password", passwordStr); put("alias", alias) }
                  metaFile.writeText(meta.toString())
                  return alias
              }

              fun getOrCreateKeystore(context: Context, packageName: String, appName: String): AppKeyMaterial {
                  val dir = File(context.filesDir, "keystores").apply { mkdirs() }
                  val safePkg = packageName.replace(Regex("[^a-zA-Z0-9._-]"), "_")
                  val p12File = File(dir, "$safePkg.p12")
                  val metaFile = File(dir, "$safePkg.meta.json")

                  var passStr = "apmbs_keystore_pass"
                  var alias = "apmbs_key"
                  if (metaFile.exists()) {
                      val meta = JSONObject(metaFile.readText())
                      passStr = meta.optString("password", passStr)
                      alias = meta.optString("alias", alias)
                  }
                  val pass = passStr.toCharArray()

                  val ks = KeyStore.getInstance("PKCS12")
                  if (p12File.exists()) {
                      FileInputStream(p12File).use { ks.load(it, pass) }
                  } else {
                      ks.load(null, null)
                      val kpg = KeyPairGenerator.getInstance("RSA")
                      kpg.initialize(2048)
                      val kp = kpg.generateKeyPair()
                      val dn = X500Principal("CN=$appName, O=APMBS App Studio, C=IN")
                      val now = System.currentTimeMillis()
                      val builder = JcaX509v3CertificateBuilder(dn, BigInteger.valueOf(now), Date(now - 86400000L), Date(now + 30L * 365 * 86400000L), dn, kp.public)
                      val cert = JcaX509CertificateConverter().getCertificate(builder.build(JcaContentSignerBuilder("SHA256withRSA").build(kp.private)))
                      ks.setKeyEntry(alias, kp.private, pass, arrayOf(cert))
                      FileOutputStream(p12File).use { ks.store(it, pass) }
                  }

                  val privKey = ks.getKey(alias, pass) as PrivateKey
                  val cert = ks.getCertificate(alias) as X509Certificate
                  val der = cert.encoded
                  val sha1 = MessageDigest.getInstance("SHA-1").digest(der).joinToString(":") { "%02X".format(it) }
                  val sha256 = MessageDigest.getInstance("SHA-256").digest(der).joinToString(":") { "%02X".format(it) }
                  val b64 = Base64.encodeToString(der, Base64.NO_WRAP).chunked(64).joinToString("\n")
                  val pem = "-----BEGIN CERTIFICATE-----\n$b64\n-----END CERTIFICATE-----"
                  return AppKeyMaterial(privKey, cert, sha1, sha256, pem, p12File)
              }
          }
